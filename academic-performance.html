<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Academic Performance — Live Quiz</title><link rel="stylesheet" href="styles.css?v=20261113-v58"><style>
body{min-height:100vh;background:radial-gradient(ellipse at 0% 20%,#173e76 0,transparent 34%),linear-gradient(145deg,#020d20,#071f42 65%,#03152d);color:#f5f7ff}
.performance-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px clamp(16px,4vw,48px);background:linear-gradient(100deg,#04152d,#082d59);border-bottom:2px solid #d8b65b}
.performance-top a{color:#ffe2a0;text-decoration:none;font-weight:800}.performance-wrap{width:min(1100px,calc(100% - 28px));margin:24px auto 50px}
.performance-hero{padding:22px;border:1px solid #d8b65b;border-radius:18px;background:linear-gradient(110deg,#061a3c,#0a3976 65%,#07569a);margin-bottom:16px}
.performance-hero .kicker{font-size:11px;letter-spacing:2px;color:#f3d27d;font-weight:900}.performance-hero h1{font:700 clamp(25px,4vw,36px) Georgia,serif;color:#ffe3a0;margin:8px 0}.performance-hero p{color:#d7e3f5;margin:0}
.performance-actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.performance-actions button{border:1px solid #d8b65b;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer}.performance-actions .back{background:#102b52;color:#ffe2a0}.performance-actions .refresh{background:#f4d47e;color:#07172f}
#studentAnalyticsContent{padding:18px;border:1px solid #d8b65b88;border-radius:16px;background:linear-gradient(145deg,#091f42,#04132b);overflow:hidden}
.performance-empty{padding:18px;border:1px dashed #d8b65b;border-radius:12px;color:#d7e3f5}.performance-empty a{color:#ffe2a0}
@media(max-width:600px){.performance-wrap{width:calc(100% - 18px);margin:14px auto 30px}#studentAnalyticsContent{padding:11px}#studentAnalyticsContent>div[style*="grid-template-columns:repeat(4"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
</style></head><body>
<header class="performance-top"><a href="student.html">← Participant Panel</a><strong>🏆 Live Quiz Competition</strong><span id="performanceParticipant">Academic Performance</span></header>
<main class="performance-wrap"><section class="performance-hero"><span class="kicker">YOUR LEARNING INSIGHTS</span><h1>My Academic Performance</h1><p id="performanceMessage">Loading your examination history…</p></section>
<div class="performance-actions"><button class="back" type="button" onclick="location.href='student.html'">← Back to Dashboard</button><button class="refresh" id="refreshPerformance" type="button">↻ Refresh Analysis</button></div>
<section id="studentAnalyticsContent"><div class="performance-empty">Loading your submitted examinations…</div></section></main>
<script type="module" src="academic-performance.js?v=20261113-v58"></script></body></html>
