<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olympiad Mock Examination</title><link rel="stylesheet" href="styles.css"><style>body{background:#f2f6fc;color:#142b49}.wrap{max-width:950px;margin:25px auto;padding:16px}.panel{background:white;border:1px solid #d9e4f1;border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 8px 24px #17385c0c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:11px;border:1px solid #cbd7e5;border-radius:9px;font:inherit}.btn{background:#1769d2;color:#fff;border:0;border-radius:9px;padding:12px 18px;font-weight:800;cursor:pointer}.q{padding:15px;border:1px solid #d9e4f1;border-radius:12px;margin:13px 0}.q label{display:block;padding:7px}.muted{color:#60738c}.hidden{display:none!important}.timer{font-size:24px;font-weight:900;color:#b42318}.status{padding:10px;background:#edf4ff;border-radius:9px}.result-summary{background:#edf7ef;border:1px solid #b8dfc0;border-radius:12px;padding:16px;margin:18px 0}.review-heading{margin-top:24px}.review-card{border:1px solid #d9e4f1;border-left:5px solid #64748b;border-radius:12px;padding:14px;margin:12px 0;background:#fff}.review-card.correct{border-left-color:#16a34a}.review-card.wrong{border-left-color:#dc2626}.review-card.unanswered{border-left-color:#64748b}.review-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.review-status{font-size:12px;font-weight:800;padding:5px 9px;border-radius:20px;background:#eef2f7}.review-card.correct .review-status{background:#dcfce7;color:#166534}.review-card.wrong .review-status{background:#fee2e2;color:#991b1b}.review-question{font-weight:750;margin:12px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="student.html">← Participant Panel</a><section class="panel" id="joinPanel"><h1>🏆 Olympiad Mock Test</h1><p class="muted">Enter your details and room code to join the examination.</p><div class="grid"><label class="field">Participant name<input id="pName" required></label><label class="field">Mobile number<input id="pMobile" inputmode="numeric" maxlength="10" required></label><label class="field">Class<select id="pClass"><option value="">Select class</option></select></label><label class="field">Subject<input id="pSubject" placeholder="Subject"></label><label class="field">Room code<input id="pCode" placeholder="OLY-XXXXXXXX" required></label></div><p><button class="btn" id="joinBtn">Verify & Join Test</button></p><div id="joinStatus" class="status">A private test requires your mobile number to be on the administrator-approved list.</div></section><section class="panel hidden" id="examPanel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h1 id="testTitle">Olympiad Examination</h1><p id="testMeta" class="muted"></p></div><div class="timer" id="timer">--:--</div></div><div id="testArea"></div><button class="btn" id="submitBtn">Submit Examination</button><div id="testResult"></div></section></main><script type="module" src="academic-test.js"></script></body></html>
