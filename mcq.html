<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCQ Examination</title><link rel="stylesheet" href="styles.css"><style>.mcq-option{display:block;width:100%;text-align:left;margin:10px 0;padding:14px;border:1px solid #d6dee8;border-radius:10px;background:#fff;cursor:pointer}.mcq-option.selected{outline:3px solid #1769e0}.exam-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.exam-timer{font-size:28px;font-weight:800}</style></head><body><header><div><h1>📝 MCQ Examination</h1><small>Participant Panel</small></div><span id="connection" class="badge">Ready</span></header><div class="container"><div class="card" id="examCard"><div class="exam-top"><div><h2 id="examTitle">MCQ Examination</h2><div>Room: <b id="roomCode"></b></div></div><div><div class="muted">Time Remaining</div><div class="exam-timer" id="timer">--:--</div></div></div></div><div id="status" class="status">Loading examination…</div><div class="card"><h2 id="qNo">Question</h2><div id="question" class="question"></div><div id="options"></div><button id="nextBtn" class="success" disabled>NEXT</button><div id="finishBtnWrap" class="hidden"><button id="finishBtn" class="success">SUBMIT EXAM</button></div><div id="message" style="margin-top:12px"></div></div><div class="card"><button id="backBtn">← Back to Assignments</button></div></div><script type="module" src="mcq.js?v=20261008-36"></script></body></html>
