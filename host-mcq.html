<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCQ Exam — Host Setup</title><link rel="stylesheet" href="styles.css"><style>.qbox{border:1px solid #d6dee8;border-radius:12px;padding:14px;margin:12px 0;background:#fafcff}.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.qgrid{grid-template-columns:1fr}}.roomcode{font-size:34px;font-weight:900;letter-spacing:5px;text-align:center}.sticky{position:sticky;top:0;z-index:5;background:#f7f9fc;padding:10px 0}</style></head><body><header><div><h1>📝 MCQ Examination — Host Setup</h1><small>Separate from Live Quiz Competition</small></div><span id="authStatus" class="badge">Checking…</span></header><div class="container"><div class="card"><h2>MCQ Exam Details</h2><div class="grid"><div class="field"><label>Exam Title *</label><input id="title" value="MCQ Examination"></div><div class="field"><label>Total Time (minutes) *</label><input id="minutes" type="number" min="1" max="240" value="30"></div><div class="field"><label>Number of Questions *</label><input id="count" type="number" min="1" max="100" value="10"></div></div><div class="row" style="margin-top:12px"><button id="createBtn" class="success">Create New MCQ Exam Room</button><button id="loadBtn" class="secondary">Load Selected MCQ Room</button><button id="backBtn" class="secondary">← Back to Host Panel</button></div><div class="row" style="margin-top:12px"><div class="field"><label>Existing MCQ Exam Room</label><select id="existingRooms"><option value="">Select a saved MCQ exam room</option></select></div><div class="field" style="justify-content:end"><button id="refreshRoomsBtn" class="secondary" type="button">🔄 Refresh Rooms</button></div></div><div id="msg" class="status" style="margin-top:12px">Select an existing room or create a new MCQ exam room.</div></div><div id="setup" class="card hidden"><div class="sticky"><div class="row" style="justify-content:space-between;align-items:center"><div><h2 style="margin:0">Room Code</h2><div id="roomCode" class="roomcode">------</div></div><button id="saveBtn" class="success">💾 Save MCQ Exam</button></div></div><div id="questions"></div></div></div><script type="module" src="host-mcq.js?v=20261001-2"></script></body></html>
